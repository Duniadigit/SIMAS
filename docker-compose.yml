version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simas-app
    container_name: simas-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - app-build:/var/www/public/build
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - simas-network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: simas-webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www
      - app-build:/var/www/public/build:ro
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - simas-network

  db:
    image: mysql:8.0
    container_name: simas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-simas}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password123}
      MYSQL_USER: ${DB_USERNAME:-simas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password123}
    volumes:
      - simas-db-data:/var/lib/mysql
    networks:
      - simas-network

volumes:
  simas-db-data:
    driver: local
  app-build:
    driver: local

networks:
  simas-network:
    driver: bridge
